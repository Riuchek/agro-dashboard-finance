services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
